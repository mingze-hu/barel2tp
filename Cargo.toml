[package]
name = "barel2tp"
version = "1.0.0"
edition = "2024"
description = "User-space bare L2TP/PPP client that does not rely on the system VPN framework"
license = "MIT"
authors = ["mingzehu <mingzehu123@gmail.com>"]
repository = "https://github.com/mingze-hu/barel2tp"
readme = "README.md"
keywords = ["l2tp", "ppp", "vpn", "tun", "networking"]
categories = ["command-line-utilities", "network-programming"]
rust-version = "1.85"
exclude = ["/app", "/scripts", "/.github", "/dist"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ipnet = { version = "2.11", features = ["serde"] }
libc = "0.2"
md-5 = "0.10"
rand = "0.9"
rpassword = "7.5"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zeroize = "1.8"

[profile.release]
lto = "thin"
strip = true
